# `agent-NN-docker` backs the in-container `/var/lib/docker`. Without it, the
# inner dockerd would inherit the container's overlay2 rootfs and fail with
# "cannot mount overlayfs read-write" the moment Testcontainers (or any nested
# `docker run`) tries to create a container layer. Named volumes are backed by
# ext4/xfs on the host, so overlay-on-volume works cleanly and pulled images
# survive container recreation.
