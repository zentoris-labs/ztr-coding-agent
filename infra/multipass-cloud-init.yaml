#cloud-config
# Multipass provisioning for a single-developer Claude Code dev VM.
#
# Model: the VM is the trust boundary (one developer, disposable box). Docker
# runs natively and the default `ubuntu` user is in the docker group — simple,
# since there's nothing else on this VM to protect from the agent. The real
# perimeter is OUTSIDE this file: keep only SCOPED, revocable creds on the VM
# (a repo-scoped git token, a least-priv cloud role) — NEVER your Windows admin
# sessions, and never log into an admin console from inside this VM.
#
# Launch (from anywhere; point --cloud-init at this file):
#   multipass launch 24.04 --name agent --cpus 4 --memory 8G --disk 60G \
#     --cloud-init <path-to-this-file>
#   multipass exec agent -- cloud-init status --wait   # block until provisioning done
#   multipass shell agent
#
# The toolchain lives in infra/provision.sh (the single source of truth); this
# file just fetches and runs it at first boot. To ADD or UPDATE tools on an
# existing VM, re-run that same script — see README "Updating the toolchain".
#
# PURE TOOLCHAIN — no secrets, no env vars — safe to commit. Credentials/keys are
# added AFTER launch, all manual (full runbook: README.md):
#   # 1. Join NetBird for reachability + DNS (VM resolves as ztr-agent-<initials>-<NN>).
#   #    Reusable setup key per README, "NetBird setup". No --allow-server-ssh —
#   #    SSH is plain OpenSSH + your key (step 2).
#   sudo netbird up --setup-key=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
#   # 2. SSH key: append your host's PUBLIC key to ~/.ssh/authorized_keys so you
#   #    can `ssh ubuntu@<hostname>` with your default key (README, quick start step 2).
#   # 3. GitHub: authenticate gh with a scoped, expiring PAT.
#   gh auth login --with-token < token.txt   # or run `gh auth login` and paste it
#
# There is NO `claude` login step: Claude Code runs on your HOST machine and
# drives the VM over SSH, so the agent box never needs its own authenticated
# Claude session — only the toolchain + NetBird reachability.

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates

runcmd:
  # Provision the full dev toolchain via the single source of truth (idempotent).
  # Pinned to `main`; the repo is public so the raw fetch needs no auth.
  - curl -fsSL https://raw.githubusercontent.com/zentoris-labs/ztr-coding-agent/main/infra/provision.sh -o /tmp/provision.sh
  - bash /tmp/provision.sh

final_message: "Provisioning complete (toolchain via infra/provision.sh). Post-launch, all manual (no secrets baked in): 1) join NetBird for DNS -- 'sudo netbird up --setup-key=<KEY>', 2) add your SSH public key to ~/.ssh/authorized_keys, 3) GitHub -- 'gh auth login'. Then 'ssh ubuntu@<hostname>'. Full runbook: README.md."
